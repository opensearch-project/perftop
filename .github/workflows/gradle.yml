name: CI

on:
  push:
    branches:
      - "*"

  pull_request:
    branches:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 12
        uses: actions/setup-java@b6e674f4b717d7b0ae3baee0fbe79f498905dfde # v1
        with:
          java-version: 12.0.x

      - name: Set up Node JS
        uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v1
        with:
          node-version: 10.15.0

      - name: Checkout perftop package
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2

      # TODO: Add tests and run in build
      - name: Build perfTop artifacts
        run: |
          ./gradlew clean
          ./gradlew build -Dbuild.snapshot=false -Dbuild.linux=true
          ./gradlew build -Dbuild.snapshot=false -Dbuild.macos=true
